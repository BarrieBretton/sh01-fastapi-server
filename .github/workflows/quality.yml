name: Code quality
on:
  push:
    branches: [main, dev, feature/ai-compose-kaggle]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python }} and FFmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      MEDIA_JOB_STORE_MODE: memory
      MEDIA_QUEUE_CONSUMER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - run: python -m pip install -r ci/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Lint correctness errors
        id: lint
        run: python -m ruff check --config ci/ruff.toml .
      - name: Unit and real render tests (skips fail CI)
        if: ${{ !cancelled() && (steps.lint.outcome == 'success' || steps.lint.outcome == 'failure') }}
        run: python -m coverage run --source=. --omit='tests/*,notebooks/*' ci/run_tests.py
      - name: Coverage report
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        run: python -m coverage report --skip-empty
      - name: Notebook and embedded source consistency
        if: ${{ !cancelled() && (steps.lint.outcome == 'success' || steps.lint.outcome == 'failure') }}
        run: python ci/check_notebook.py
  workers:
    name: Cloudflare Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks and existing Node tests
        shell: bash
        run: |
          for file in cloudflare/*-worker.js; do
            node --input-type=module --check < "$file"
          done
          node --test cloudflare/tests/*.test.mjs
  decoder:
    name: Whisper decoder compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies declared by the notebook template
        run: python ci/check_decoder.py
